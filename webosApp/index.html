<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ZYVIOTV Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <p class="eyebrow">ZYVIOTV PLAYER</p>
      <h1>Connexion</h1>
      <p class="auth-copy">Connectez votre compte pour restaurer vos playlists sur cette TV LG.</p>
      <label>
        <span>Adresse e-mail</span>
        <input id="auth-email" data-focusable type="email" autocomplete="email">
      </label>
      <label>
        <span>Mot de passe</span>
        <input id="auth-password" data-focusable type="password" autocomplete="current-password">
      </label>
      <button class="primary" data-focusable data-action="sign-in">Se connecter</button>
      <div id="auth-status" class="status" aria-live="polite"></div>
    </div>
  </section>

  <main id="app-shell" class="shell" hidden>
    <aside class="rail">
      <div class="brand">
        <strong>ZYVIOTV</strong>
        <span>PLAYER</span>
      </div>
      <nav>
        <button data-focusable data-section="home" class="nav active">Accueil</button>
        <button data-focusable data-section="live" class="nav">TV</button>
        <button data-focusable data-section="movies" class="nav">Films</button>
        <button data-focusable data-section="series" class="nav">Séries</button>
        <button data-focusable data-section="more" class="nav">Plus</button>
      </nav>
    </aside>

    <section class="content">
      <video id="tv-player" class="tv-player" playsinline hidden></video>
      <header class="hero">
        <p class="eyebrow">LG SMART TV</p>
        <h1>Tout votre univers au même endroit.</h1>
        <p>Interface grand écran pensée pour la télécommande LG.</p>
        <button class="primary" data-focusable data-section="live">Regarder la TV</button>
      </header>

      <section class="shelf">
        <h2>Accès rapide</h2>
        <div class="cards">
          <button class="card" data-focusable data-section="live">TV en direct</button>
          <button class="card" data-focusable data-section="movies">Films</button>
          <button class="card" data-focusable data-section="series">Séries</button>
          <button class="card" data-focusable data-section="favorites">Favoris</button>
        </div>
      </section>

      <section id="live-panel" class="catalog-panel" hidden>
        <div class="catalog-header">
          <h2>TV en direct</h2>
          <span id="live-count"></span>
        </div>
        <div id="live-grid" class="catalog-grid"></div>
      </section>

      <section id="catalog-panel" class="catalog-panel" hidden>
        <div class="catalog-header">
          <h2 id="catalog-title">Catalogue</h2>
          <span id="catalog-count"></span>
        </div>
        <div id="catalog-grid" class="catalog-grid"></div>
      </section>

      <section id="account-panel" class="catalog-panel" hidden>
        <div class="catalog-header">
          <h2>Plus</h2>
        </div>
        <div class="cards">
          <button class="card" data-focusable data-action="sign-out">Se déconnecter</button>
        </div>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="auth.js"></script>
  <script src="cloud.js"></script>
  <script src="provider.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
