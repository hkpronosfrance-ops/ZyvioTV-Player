name: Android Smoke APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "shared/**"
      - "iosApp/**"
      - "tizenApp/**"
      - "webosApp/**"
      - ".github/workflows/android-smoke-apk.yml"
      - "docs/SMOKE_TEST.md"
  push:
    branches:
      - "feat/phase-18-5-real-device-smoke-test"

permissions:
  contents: read

jobs:
  build-smoke-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug smoke APK
        run: gradle assembleDebug --stacktrace

      - name: Generate SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: zyviotv-player-smoke-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
