name: Shared + Android CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android playback wiring contracts (#207)
        run: python3 -m unittest discover -s tests -p 'test_android_playback_207.py' -v

      - name: Android playback source contracts (#208)
        run: python3 -m unittest discover -s tests -p 'test_android_playback_sources_208.py' -v

      - name: Shared and Android unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle lintDebug --stacktrace

      - name: Verify release cleartext policy and build
        run: |
          gradle processReleaseMainManifest assembleRelease --stacktrace
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="true"' app/src/main/res/xml/network_security_config.xml

      - name: Build Android debug APK
        run: gradle assembleDebug --stacktrace
