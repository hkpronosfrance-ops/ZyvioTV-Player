name: webOS CI

on:
  pull_request:
    paths:
      - "webosApp/**"
      - ".github/workflows/webos-ci.yml"
      - "scripts/d7_source_audit.py"
      - "tests/test_d7_crossplatform_source_audit.py"
      - "docs/d7-visual-evidence-pack.md"
  push:
    branches:
      - main
    paths:
      - "webosApp/**"
      - ".github/workflows/webos-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate D7 cross-platform source contract
        run: python3 scripts/d7_source_audit.py

      - name: Validate D7 final source regression and evidence status
        run: python3 -m unittest discover -s tests -p 'test_d7_final_193.py' -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check webosApp/app.js
          node --check webosApp/auth.js
          node --check webosApp/cloud.js

      - name: Validate D6 television UI regression contracts
        run: node webosApp/d6-interface.test.cjs

      - name: Validate M3U functional and category isolation audit
        run: node tests/m3u-functional-audit-194.cjs webosApp

      - name: Validate Xtream Live Movies Series and episodes
        run: node tests/xtream-functional-195.cjs webosApp

      - name: Validate provider core
        run: node webosApp/provider.test.cjs

      - name: Validate full M3U catalog contract
        run: node webosApp/m3u-catalog.test.cjs

      - name: Validate playback adapter syntax
        run: node --check webosApp/player.js

      - name: Validate appinfo.json
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("webosApp/appinfo.json", "utf8"));
          if (!data.id || !data.version || data.type !== "web" || data.main !== "index.html") {
            throw new Error("Invalid webOS appinfo.json");
          }
          if (!Array.isArray(data.requiredACG)) {
            throw new Error("requiredACG must be declared");
          }
          if (data.icon !== "icon.png" || data.largeIcon !== "icon-large.png") {
            throw new Error("Expected webOS icon metadata is missing");
          }
          console.log("webOS manifest structure OK");
          NODE

      - name: Validate required client files
        run: |
          test -s webosApp/index.html
          test -s webosApp/styles.css
          test -s webosApp/app.js
          test -s webosApp/auth.js
          test -s webosApp/cloud.js
          test -s webosApp/provider.js
          test -s webosApp/player.js
          test -s webosApp/appinfo.json
          test -s webosApp/icon.png
          test -s webosApp/icon-large.png
          test -s webosApp/package-ipk.sh
          test -s webosApp/PHYSICAL_QA.md

      - name: Validate LG icon dimensions
        run: |
          node - <<'NODE'
          const fs = require("fs");
          function pngSize(path) {
            const b = fs.readFileSync(path);
            if (b.toString("hex", 0, 8) !== "89504e470d0a1a0a") throw new Error(path + " is not PNG");
            return { width: b.readUInt32BE(16), height: b.readUInt32BE(20) };
          }
          const small = pngSize("webosApp/icon.png");
          const large = pngSize("webosApp/icon-large.png");
          if (small.width !== 80 || small.height !== 80) throw new Error("icon.png must be 80x80");
          if (large.width !== 130 || large.height !== 130) throw new Error("icon-large.png must be 130x130");
          console.log("LG icon dimensions OK");
          NODE

      - name: Validate package script
        run: bash -n webosApp/package-ipk.sh

      - name: Install current webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Build FHD IPK
        env:
          WEBOS_RESOLUTION: 1920x1080
        run: bash webosApp/package-ipk.sh

      - name: Build HD IPK
        env:
          WEBOS_RESOLUTION: 1280x720
        run: bash webosApp/package-ipk.sh

      - name: Verify packaged artifacts
        run: |
          FHD_IPK="$(find webosApp/dist/1920X1080 -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          HD_IPK="$(find webosApp/dist/1280X720 -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$FHD_IPK"
          test -n "$HD_IPK"
          ares-package --info "$FHD_IPK"
          ares-package --info "$HD_IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyviotv-webos-ipk
          path: webosApp/dist/**/*.ipk
          if-no-files-found: error
          retention-days: 14
