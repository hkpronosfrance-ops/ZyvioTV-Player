name: Tizen CI

on:
  pull_request:
    paths:
      - "tizenApp/**"
      - ".github/workflows/tizen-ci.yml"
      - "scripts/d7_source_audit.py"
      - "tests/test_d7_crossplatform_source_audit.py"
      - "docs/d7-visual-evidence-pack.md"
  push:
    branches:
      - main
    paths:
      - "tizenApp/**"
      - ".github/workflows/tizen-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate D7 cross-platform source contract
        run: python3 scripts/d7_source_audit.py

      - name: Check D6 TV and iOS presentation contracts
        run: python3 -m unittest discover -s tests -p 'test_d6_crossplatform_polish_192.py' -v

      - name: Validate TV remote input editing navigation
        run: python3 -m unittest discover -s tests -p 'test_tv_navigation_198.py' -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check tizenApp/app.js
          node --check tizenApp/auth.js
          node --check tizenApp/cloud.js

      - name: Validate M3U functional and category isolation audit
        run: node tests/m3u-functional-audit-194.cjs tizenApp

      - name: Validate Xtream Live Movies Series and episodes
        run: node tests/xtream-functional-195.cjs tizenApp

      - name: Validate phase 197 account playlist restore
        run: node tests/account-playlist-197.cjs tizenApp

      - name: Validate provider core
        run: node tizenApp/provider.test.cjs

      - name: Validate phase 196 player failure recovery
        run: node tests/player-reliability-196.cjs tizenApp

      - name: Validate playback adapter syntax
        run: node --check tizenApp/player.js

      - name: Validate parental playback state
        run: node tizenApp/player.test.cjs

      - name: Validate multi-playlist library isolation
        run: node tizenApp/multiplaylist.test.cjs

      - name: Validate stable device identity
        run: node tizenApp/device-uid.test.cjs

      - name: Validate canonical Home parity
        run: node tizenApp/home-parity.test.cjs

      - name: Validate Tizen manifest XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("tizenApp/config.xml")
          root = ET.parse(manifest).getroot()

          ns = {
              "w": "http://www.w3.org/ns/widgets",
              "t": "http://tizen.org/ns/widgets",
          }

          assert root.tag == "{http://www.w3.org/ns/widgets}widget"
          assert root.find("w:content", ns) is not None
          profile = root.find("t:profile", ns)
          assert profile is not None and profile.attrib.get("name") == "tv-samsung"
          application = root.find("t:application", ns)
          assert application is not None
          assert application.attrib.get("id")
          assert application.attrib.get("package")
          assert application.attrib.get("required_version") == "6.0"

          privileges = {
              item.attrib.get("name")
              for item in root.findall("t:privilege", ns)
          }
          assert "http://tizen.org/privilege/internet" in privileges
          assert "http://developer.samsung.com/privilege/productinfo" in privileges

          setting = root.find("t:setting", ns)
          assert setting is not None
          assert setting.attrib.get("hwkey-event") == "enable"

          access = root.find("w:access", ns)
          assert access is not None
          assert access.attrib.get("origin") == "*"

          version = root.attrib.get("version", "")
          parts = version.split(".")
          assert len(parts) == 3 and all(part.isdigit() for part in parts)

          print("Tizen release manifest structure OK")
          PY

      - name: Validate required client files
        run: |
          test -s tizenApp/index.html
          test -s tizenApp/styles.css
          test -s tizenApp/app.js
          test -s tizenApp/auth.js
          test -s tizenApp/cloud.js
          test -s tizenApp/provider.js
          test -s tizenApp/player.js
          test -s tizenApp/config.xml


      - name: Validate WGT packaging script
        run: bash -n tizenApp/package-wgt.sh

      - name: Reject committed Tizen signing artifacts
        run: |
          if find tizenApp -type f \( -name '*.wgt' -o -name '*.p12' -o -name '*.pfx' -o -name '*.pem' -o -name '*.key' -o -name 'author-signature.xml' -o -name 'signature1.xml' \) | grep -q .; then
            echo "Tizen signing/package artifact committed to source."
            exit 1
          fi
